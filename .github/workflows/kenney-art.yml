name: Kenney CC0 art integration

on:
  push:
    branches:
      - art/kenney-cc0-first-pass
  pull_request:
    paths:
      - 'demos/changfeng-battle/assets/**'
      - 'demos/changfeng-battle/scripts/battle_art.gd'
      - 'demos/changfeng-battle/scripts/opening_flow.gd'
      - 'demos/changfeng-battle/checks/test_kenney_assets.gd'
      - '.github/workflows/kenney-art.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Import scene and image textures
        run: godot --headless --path demos/changfeng-battle --editor --import --quit
      - name: Verify imported PNG dimensions and scenes
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_kenney_assets.gd
      - name: Smoke test unchanged combat/story rules
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_opening_story test_tingfeng test_parties; do
            godot --headless --path demos/changfeng-battle --script "res://checks/${suite}.gd"
          done

  screenshot-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 fonts-noto-cjk
      - name: Capture canonical 2D battle and opening
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path demos/changfeng-battle --editor --import --quit
          timeout --signal=TERM 150s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path demos/changfeng-battle --script res://checks/capture_hd2d_unified_hud.gd
          timeout --signal=TERM 150s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path demos/changfeng-battle --script res://checks/capture_opening_story_2d.gd
          test -s demos/changfeng-battle/captures/hd2d-validation/01-board.png
          test -s demos/changfeng-battle/captures/hd2d-validation/05-prologue-3v3.png
          test -s demos/changfeng-battle/captures/opening-explore.png
          test -s demos/changfeng-battle/captures/opening-dialogue.png
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenney-cc0-first-pass-screenshots
          path: |
            demos/changfeng-battle/captures/hd2d-validation/*.png
            demos/changfeng-battle/captures/opening-*.png
          if-no-files-found: warn
