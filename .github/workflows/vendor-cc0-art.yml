name: Vendor verified CC0 art
on:
  push:
    branches: [feature/cc0-art-first-pass]
    paths:
      - ".github/workflows/vendor-cc0-art.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cc0-art-first-pass
          persist-credentials: true
      - name: Download verified CC0 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demos/changfeng-battle/assets/third_party/oga_cc0
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, time
          base = pathlib.Path("demos/changfeng-battle/assets/third_party/oga_cc0")
          sources = {
              "open_tileset.png": "https://opengameart.org/sites/default/files/open_tileset_0.png",
              "rpg_skill_tree_icons.png": "https://opengameart.org/sites/default/files/rpg_skill_tree_icons_1.png",
              "misc_icons.png": "https://opengameart.org/sites/default/files/misc_icons.png",
          }
          for name,url in sources.items():
              err=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (licensed asset fetch for changfeng demo)"})
                      with urllib.request.urlopen(req, timeout=35) as response:
                          data=response.read(1_000_001)
                      if not data.startswith(b"\x89PNG\r\n\x1a\n") or len(data)>1_000_000 or len(data)<100:
                          raise ValueError(f"not a valid reasonably-sized PNG: {name}, {len(data)} bytes")
                      (base/name).write_bytes(data)
                      print(f"{name}: {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}")
                      err=None
                      break
                  except Exception as ex:
                      err=ex
                      print(f"{name} attempt {attempt+1}: {ex}")
                      time.sleep(2)
              if err is not None:
                  if name=="open_tileset.png": raise SystemExit(f"Primary tileset failed: {err}")
                  print(f"Optional icon sheet skipped: {name} / {err}")
          PY
      - name: Push binary assets to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/changfeng-battle/assets/third_party/oga_cc0
          if git diff --cached --quiet; then
            echo "Assets already committed"
          else
            git commit -m "assets: vendor CC0 tiles and RPG icons with provenance"
            git push origin HEAD:feature/cc0-art-first-pass
          fi
