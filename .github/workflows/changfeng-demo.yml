name: Changfeng Demo

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "demos/changfeng-battle/**"
      - ".github/workflows/changfeng-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: true
      - name: Validate Godot project import
        run: |
          godot --version
          godot --headless --path demos/changfeng-battle --editor --import --quit
      - name: Check new GDScript parsers directly
        shell: bash
        run: |
          set -euo pipefail
          for script in martial_progression character_progression state_system attribute_modifier_pipeline technique_runtime inventory_system save_system inventory_view martial_hall_view save_slots_view; do
            godot --headless --path demos/changfeng-battle --check-only --script "res://scripts/${script}.gd"
          done
      - name: Fast integration gate for save, equipment, consumables and mastery
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path demos/changfeng-battle --script res://checks/test_save_inventory_martial.gd
      - name: Run existing combat and demo contracts
        shell: bash
        run: |
          set -euo pipefail
          project="demos/changfeng-battle"
          for name in \
            test_tingfeng \
            test_tingfeng_ai \
            test_tingfeng_edges \
            test_tingfeng_playthrough \
            test_wuxue_catalog \
            test_wuxue_v3 \
            test_wuxue_playthrough \
            test_ability_framework \
            test_generated_cards \
            test_model_lifecycle \
            test_parties \
            test_opening_story \
            test_demo_flow \
            test_demo_technique \
            test_unified_state_progression \
            test_save_inventory_martial
          do
            echo "::group::${name}"
            godot --headless --path "$project" --script "res://checks/${name}.gd"
            echo "::endgroup::"
          done
      - name: Export Windows standalone demo
        shell: bash
        run: |
          mkdir -p demos/changfeng-battle/build
          (cd demos/changfeng-battle && godot --headless --path . --export-release "Windows Desktop" build/ChangfengDemo.exe)
          test -s demos/changfeng-battle/build/ChangfengDemo.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: changfeng-demo-windows
          path: |
            demos/changfeng-battle/build/*.exe
            demos/changfeng-battle/build/*.pck
          if-no-files-found: error

  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: "4.7.2"
          use-dotnet: false
      - name: Install virtual X display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 mesa-utils
      - name: Render and inspect screenshots
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path demos/changfeng-battle -- --opening-visual-check
          xvfb-run -a godot --path demos/changfeng-battle res://battle.tscn -- --ink-visual-check
          test -s demos/changfeng-battle/captures/opening-title.png
          test -s demos/changfeng-battle/captures/opening-dialogue.png
          test -s demos/changfeng-battle/captures/ink-action.png
      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changfeng-demo-screenshots
          path: demos/changfeng-battle/captures/*.png
          if-no-files-found: warn
