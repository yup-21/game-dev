name: Original Wuxia HUD regression

on:
  pull_request:
    paths:
      - 'demos/changfeng-battle/assets/ui/**'
      - 'demos/changfeng-battle/scripts/hd2d_card_ui.gd'
      - 'demos/changfeng-battle/scripts/opening_flow.gd'
      - 'demos/changfeng-battle/scripts/demo_result.gd'
      - 'demos/changfeng-battle/checks/test_single_battle_entry.gd'
      - 'demos/changfeng-battle/checks/opening_visual_check.gd'
      - 'demos/changfeng-battle/scripts/hd2d_ui_theme.gd'
      - 'demos/changfeng-battle/scripts/hd2d_battle.gd'
      - 'demos/changfeng-battle/scripts/card_system.gd'
      - 'demos/changfeng-battle/scripts/combat_resolver.gd'
      - 'demos/changfeng-battle/scripts/school_catalog.gd'
      - 'demos/changfeng-battle/data/tingfeng_cards.json'
      - 'demos/changfeng-battle/data/school_forms.json'
      - 'demos/changfeng-battle/data/demo_scenario.json'
      - 'demos/changfeng-battle/checks/test_derived_wuxue_decks.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_wuxia_ui.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_ui_assets.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_unified_hud.gd'
      - 'demos/changfeng-battle/scripts/hd2d_card_art.gd'
      - '.github/workflows/wuxia-hud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Import PNG and SVG art
        run: godot --headless --path demos/changfeng-battle --editor --import --quit
      - name: Assert only the illustrated battle is player-facing
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_single_battle_entry.gd
      - name: Check existing original art is actually used in 3D battle
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_art_integration.gd
      - name: Check original UI atlas and model-backed HUD
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_wuxia_ui.gd
      - name: Check additional card mappings and HUD compatibility
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_ui_assets.gd
      - name: Check unified borderless HUD structure
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_unified_hud.gd
      - name: Check clickable hand and animation request lifecycle
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_interactions.gd
      - name: Validate generated martial cards and actor-specific schools
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_derived_wuxue_decks.gd
      - name: Check original multi-school V3 mechanics
        run: |
          godot --headless --path demos/changfeng-battle --script res://checks/test_wuxue_catalog.gd
          godot --headless --path demos/changfeng-battle --script res://checks/test_generated_cards.gd
      - name: Check six-actor prologue encounter
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_story_encounter.gd


  visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Prepare virtual display and CJK font fallback
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 fonts-noto-cjk
      - name: Capture actual HD-2D battle and selected card
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path demos/changfeng-battle --editor --import --quit
          xvfb-run -a -s "-screen 0 1600x1000x24" godot --path demos/changfeng-battle --script res://checks/capture_hd2d_unified_hud.gd
          test -s demos/changfeng-battle/captures/hd2d-validation/01-board.png
          test -s demos/changfeng-battle/captures/hd2d-validation/02-card-selection.png
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-wuxia-hud-visual-evidence
          path: demos/changfeng-battle/captures/hd2d-validation/*.png
          if-no-files-found: warn
