      - 'demos/changfeng-battle/scripts/battle_command_controller.gd'
      - 'demos/changfeng-battle/scripts/battle_input_controller.gd'
      - 'demos/changfeng-battle/checks/test_battle_input_controller.gd'
      - 'demos/changfeng-battle/checks/test_battle_command_dispatcher.gd'
      - 'demos/changfeng-battle/scripts/illustrated_battle_map.gd'
      - 'demos/changfeng-battle/scripts/battle_vfx_2d.gd'
      - 'demos/changfeng-battle/checks/test_battle_pure_2d.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_startup.gd'
      - 'demos/changfeng-battle/battle_hd2d.tscn'
      - 'demos/changfeng-battle/scripts/map_bake.gd'
      - 'demos/changfeng-battle/data/maps/**'
      - 'demos/changfeng-battle/checks/test_baked_bridge_grid.gd'
      - 'demos/changfeng-battle/assets/scenes/**'
      - 'demos/changfeng-battle/checks/test_illustrated_maps.gd'
      - 'demos/changfeng-battle/scripts/actor_facing.gd'
      - 'demos/changfeng-battle/scripts/hd2d_animation.gd'
      - 'demos/changfeng-battle/scripts/battle_presentation_coordinator.gd'
      - 'demos/changfeng-battle/checks/test_battle_presentation_coordinator.gd'
      - 'demos/changfeng-battle/scripts/battle_spatial_service.gd'
      - 'demos/changfeng-battle/checks/test_free_crowd_navigation.gd'
      - 'demos/changfeng-battle/checks/test_story_background_content.gd'
      - 'demos/changfeng-battle/scripts/battle_state.gd'
      - 'demos/changfeng-battle/checks/test_actor_facing.gd'
      - 'demos/changfeng-battle/scripts/character_registry.gd'
      - 'demos/changfeng-battle/checks/test_multi_school_switch.gd'
      - 'demos/changfeng-battle/scripts/character_card_ui.gd'
      - 'demos/changfeng-battle/scripts/hd2d_art_catalog.gd'
      - 'demos/changfeng-battle/scripts/scenario_director.gd'
      - 'demos/changfeng-battle/scripts/combatant_state.gd'
      - 'demos/changfeng-battle/data/characters/**'
      - 'demos/changfeng-battle/checks/test_character_registry.gd'
      - 'demos/changfeng-battle/scripts/hd2d_ctb_rail.gd'
      - 'demos/changfeng-battle/scripts/hd2d_response_policy.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_auto_pass.gd'
      - 'demos/changfeng-battle/checks/test_bridge_auto_battle.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_wuxia_ui.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_ui_assets.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_unified_hud.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_ctb_rail.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_ornament_hud.gd'
      - 'demos/changfeng-battle/checks/test_hd2d_hand_visibility.gd'
      - 'demos/changfeng-battle/scripts/hd2d_card_art.gd'
      - 'demos/changfeng-battle/scripts/card_system.gd'
      - 'demos/changfeng-battle/scripts/combat_resolver.gd'
      - 'demos/changfeng-battle/scripts/school_catalog.gd'
      - 'demos/changfeng-battle/data/tingfeng_cards.json'
      - 'demos/changfeng-battle/data/techniques.json'
      - 'demos/changfeng-battle/scripts/technique_runtime.gd'
      - 'demos/changfeng-battle/scripts/ability_system.gd'
      - 'demos/changfeng-battle/scripts/battle_model.gd'
      - 'demos/changfeng-battle/data/school_forms.json'
      - 'demos/changfeng-battle/data/demo_scenario.json'
      - 'demos/changfeng-battle/checks/test_derived_wuxue_decks.gd'
      - '.github/workflows/wuxia-hud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Import PNG and SVG art
        run: godot --headless --path demos/changfeng-battle --editor --import --quit
      - name: Validate first-act Sprite2D characters, real assets, movement and elder dialogue
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_opening_sprites.gd
      - name: Assert only the illustrated battle is player-facing
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_single_battle_entry.gd
      - name: Verify 150 baked orthographic cells, river-blocked hitboxes and 3v3 paths
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_baked_bridge_grid.gd
      - name: Validate continuous battle movement and attack approach
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_continuous_space.gd
      - name: Validate safe close-quarter FREE navigation and crowded clicks
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_free_crowd_navigation.gd
      - name: Keep PR57 visibility graph regression
        run: timeout --signal=TERM 40s godot --headless --path demos/changfeng-battle --script res://checks/test_continuous_battle_space.gd
      - name: Validate both spatial APIs after restoring reverted PR62
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_spatial_api_coexistence.gd
      - name: Validate committed free movement and rollback
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_free_move_command.gd
      - name: Validate atomic auto approach and martial card attacks
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_move_and_attack.gd
      - name: Check live Sprite2D automatic approach UI commands
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_move_and_attack_ui.gd
      - name: Guard refactored command adapter and versioned submissions
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_battle_command_dispatcher.gd
      - name: Validate extracted input intent and guarded view submission
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_battle_input_controller.gd
      - name: Validate two authoritative spatial modes and live transitions
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_dual_spatial_mode.gd
      - name: Exercise in-battle M toggle and mode preference persistence
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_dual_spatial_mode_ui.gd
      - name: Verify free martial step and LIFO evasive response
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_free_martial_movement.gd
      - name: Validate continuous AI duel and six-character encounter
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_free_space_ai.gd
      - name: Validate 2D painted terrain and story character registration
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_illustrated_maps.gd
      - name: Guard true Node2D scene and shake compensated input
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_battle_pure_2d.gd
      - name: Validate legacy startup suite against canonical Sprite2D
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_startup.gd
      - name: Check original character art in painted battle
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_art_integration.gd
      - name: Check original UI atlas and model-backed HUD
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_wuxia_ui.gd
      - name: Check additional card mappings and HUD compatibility
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_ui_assets.gd
      - name: Check unified borderless HUD structure
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_unified_hud.gd
      - name: Check drawn attacks remain visible outside attack range
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_hand_visibility.gd
      - name: Verify detached physical hand and its disabled card fallbacks
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_battle_hand_view.gd
      - name: Check the right-side authoritative charge track
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_ctb_rail.gd
      - name: Check ornate fan tray, portraits and genuine CTB presentation
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_ornament_hud.gd
      - name: Check clickable hand and animation request lifecycle
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_interactions.gd
      - name: Validate single-acknowledge presentation and skip lifecycle
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_battle_presentation_coordinator.gd
      - name: Verify automatic empty-response skips and authoritative clash resolution
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_auto_pass.gd
      - name: Play seeded six-character bridge battles through production AI
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_bridge_auto_battle.gd
      - name: Validate generated martial cards and actor-specific schools
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_derived_wuxue_decks.gd
      - name: Check original multi-school V3 mechanics
        run: |
          godot --headless --path demos/changfeng-battle --script res://checks/test_wuxue_catalog.gd
          godot --headless --path demos/changfeng-battle --script res://checks/test_generated_cards.gd
      - name: Verify old Tingfeng rules, chained stages, and V3 school compatibility
        run: |
          godot --headless --path demos/changfeng-battle --script res://checks/test_tingfeng.gd
          godot --headless --path demos/changfeng-battle --script res://checks/test_ability_framework.gd
          godot --headless --path demos/changfeng-battle --script res://checks/test_wuxue_v3.gd
      - name: Validate character registry, profile bindings and live role dossier
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_character_registry.gd
      - name: Verify multiple learned schools, switching, card-zone integrity and UI
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_multi_school_switch.gd
      - name: Check four-way actor facing, movement path and attack targets
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_actor_facing.gd
      - name: Assert first-act painting has visible nonwhite content
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_story_background_content.gd
      - name: Check six-actor prologue encounter
        run: godot --headless --path demos/changfeng-battle --script res://checks/test_hd2d_story_encounter.gd


  visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Prepare virtual display and CJK font fallback
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 fonts-noto-cjk
      - name: Capture actual HD-2D battle and selected card
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path demos/changfeng-battle --editor --import --quit
          xvfb-run -a -s "-screen 0 1600x1000x24" godot --path demos/changfeng-battle --script res://checks/capture_hd2d_unified_hud.gd
          test -s demos/changfeng-battle/captures/hd2d-validation/01-board.png
          test -s demos/changfeng-battle/captures/hd2d-validation/02-card-selection.png
          test -s demos/changfeng-battle/captures/hd2d-validation/03-character-dossier.png
          test -s demos/changfeng-battle/captures/hd2d-validation/04-baked-grid.png
      - name: Capture real first-act story and injured elder
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s " -screen 0 1600x1000x24" godot --path demos/changfeng-battle -- --opening-visual-check
          test -s demos/changfeng-battle/captures/opening-explore.png
          test -s demos/changfeng-battle/captures/opening-dialogue.png
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-wuxia-hud-visual-evidence
          path: |
            demos/changfeng-battle/captures/hd2d-validation/*.png
            demos/changfeng-battle/captures/opening-*.png
            demos/changfeng-battle/assets/scenes/story/ruined_temple_story.webp
          if-no-files-found: warn
