name: Video to Sprite Candidate Tests

on:
  pull_request:
    paths:
      - 'art-production/tools/video_to_sprite.py'
      - 'art-production/tools/test_video_to_sprite.py'
      - '.github/workflows/video-to-sprite.yml'
  push:
    branches: [main]
    paths:
      - 'art-production/tools/video_to_sprite.py'
      - 'art-production/tools/test_video_to_sprite.py'

jobs:
  candidate-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Install FFmpeg for real MP4 smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Unit and geometry checks
        run: python -m unittest discover -s art-production/tools -p 'test_video_to_sprite.py' -v
